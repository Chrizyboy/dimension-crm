# Prüft jeden Push und Pull Request: Format, Lint, Typen, Tests, Build, Browser-Tests,
# Datenbank-Tests und den Windows-Installer.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, Typen, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  datenbank:
    name: Datenbank (Migrationen, pgTAP, Anmeldung)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase start -x studio,imgproxy,realtime,pooler,vector,analytics
      - run: supabase test db
      # Phase 4: Anmeldung und Rechte im Browser mit den Testpersonen aus seed.sql.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Adresse und öffentlichen Schlüssel der lokalen Supabase übernehmen
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | sed -e 's/^API_URL=/VITE_SUPABASE_URL=/' -e 's/^ANON_KEY=/VITE_SUPABASE_ANON_KEY=/' -e 's/"//g' >> "$GITHUB_ENV"
      - run: npx playwright test --project=anmeldung
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-anmeldung
          path: playwright-report
          retention-days: 7

  windows:
    name: Windows-Installer (Tauri)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run app:build
      - uses: actions/upload-artifact@v4
        with:
          name: dimension-crm-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
