# Prüft jeden Push und Pull Request: Format, Lint, Typen, Tests, Build, Browser-Tests,
# Datenbank-Tests und den Windows-Installer.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, Typen, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  datenbank:
    name: Datenbank (Migrationen, pgTAP, Browser-Tests mit Datenbank)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase start -x studio,imgproxy,realtime,pooler,vector,analytics
      - run: supabase test db
      # Phase 4 und 5: Anmeldung, Rechte und Kundenablauf im Browser mit den Testpersonen aus seed.sql.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Adresse und Schlüssel der lokalen Supabase übernehmen
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | sed -e 's/^API_URL=/VITE_SUPABASE_URL=/' -e 's/^ANON_KEY=/VITE_SUPABASE_ANON_KEY=/' -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' -e 's/"//g' >> "$GITHUB_ENV"
      # Edge Functions für Einladung und Helpdesk im Hintergrund.
      - run: supabase functions serve > functions.log 2>&1 &
      # Alle Abläufe mit Datenbank (Anmeldung bis Zeiterfassung). Früher liefen hier nur Anmeldung und Kunden,
      # die übrigen 22 Gruppen nur von Hand; so blieben Fehler wie die gesperrte Seite nach einem Menü unbemerkt.
      - name: Browser-Tests mit Datenbank
        run: |
          projekte=$(grep -oE "name: '[a-z]+'" playwright.config.ts | sed -E "s/name: '([a-z]+)'/\1/" | grep -vE '^(desktop|handy)$' | sed 's/^/--project=/' | tr '\n' ' ')
          npx playwright test $projekte
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-anmeldung
          path: playwright-report
          retention-days: 7

  windows:
    name: Windows-Installer (Tauri)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run app:build
      - uses: actions/upload-artifact@v4
        with:
          name: dimension-crm-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
