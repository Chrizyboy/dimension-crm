[package]
name = "dimension-crm"
version = "0.1.0"
description = "Dimension CRM – Windows-App"
authors = ["Dimension Solaire"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "dimension_crm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Automatische Updates (Phase 16): neue Version von GitHub holen, Signatur prüfen, App neu starten.
tauri-plugin-updater = "=2.13.3"
tauri-plugin-process = "=2.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
